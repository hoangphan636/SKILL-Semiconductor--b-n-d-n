<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px #00F2FE); }
        50% { opacity: 1; filter: drop-shadow(0 0 18px #00F2FE); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatChip {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .pulsing-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .circuit-flow { stroke-dasharray: 6 14; animation: dashMove 2.5s linear infinite; }
      .floating-chip { animation: floatChip 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#4FACFE" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Circuit Traces Left -->
  <g opacity="0.75">
    <path d="M 0 100 L 120 100 L 170 150 L 220 150" fill="none" stroke="#00F2FE" stroke-width="1.8" />
    <circle cx="220" cy="150" r="4" fill="#00F2FE" />
    <path d="M 0 240 L 140 240 L 190 190 L 240 190" fill="none" stroke="#7928CA" stroke-width="1.8" />
    <circle cx="240" cy="190" r="4" fill="#7928CA" />
    <path d="M 50 0 L 50 60 L 100 110 L 100 180" fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="4 6" />
    <!-- Dynamic animated data packet -->
    <path d="M 0 100 L 120 100 L 170 150 L 220 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" class="circuit-flow" />
  </g>

  <!-- Circuit Traces Right -->
  <g opacity="0.75">
    <path d="M 1200 100 L 1080 100 L 1030 150 L 980 150" fill="none" stroke="#00F2FE" stroke-width="1.8" />
    <circle cx="980" cy="150" r="4" fill="#00F2FE" />
    <path d="M 1200 240 L 1060 240 L 1010 190 L 960 190" fill="none" stroke="#FF0080" stroke-width="1.8" />
    <circle cx="960" cy="190" r="4" fill="#FF0080" />
    <path d="M 1150 340 L 1150 280 L 1100 230 L 1100 160" fill="none" stroke="#7928CA" stroke-width="1.2" stroke-dasharray="4 6" />
    <!-- Dynamic animated data packet -->
    <path d="M 1200 100 L 1080 100 L 1030 150 L 980 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" class="circuit-flow" />
  </g>

  <!-- Central Silicon Chip Graphic (Floating 3D) -->
  <g class="floating-chip" transform="translate(600, 75)" filter="url(#softShadow)">
    <!-- Interposer Base -->
    <rect x="-80" y="-30" width="160" height="70" rx="8" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5" />
    
    <!-- Die Substrate -->
    <rect x="-65" y="-22" width="130" height="54" rx="4" fill="url(#chipGrad)" stroke="#334155" stroke-width="1" />
    
    <!-- UCIe / Microbump Pins -->
    <g fill="#F59E0B" opacity="0.9">
      <circle cx="-50" cy="24" r="2.5" />
      <circle cx="-35" cy="24" r="2.5" />
      <circle cx="-20" cy="24" r="2.5" />
      <circle cx="-5" cy="24" r="2.5" />
      <circle cx="10" cy="24" r="2.5" />
      <circle cx="25" cy="24" r="2.5" />
      <circle cx="40" cy="24" r="2.5" />
      <circle cx="55" cy="24" r="2.5" />
    </g>

    <!-- Silicon Die Internal Layout Blocks -->
    <rect x="-55" y="-14" width="45" height="30" rx="2" fill="#1E293B" stroke="#00F2FE" stroke-width="0.8" opacity="0.8" />
    <text x="-32" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#00F2FE" text-anchor="middle">CPU/NPU</text>

    <rect x="-3" y="-14" width="28" height="30" rx="2" fill="#1E293B" stroke="#7928CA" stroke-width="0.8" opacity="0.8" />
    <text x="11" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" fill="#C084FC" text-anchor="middle">UCIe 2.0</text>

    <rect x="30" y="-14" width="25" height="30" rx="2" fill="#1E293B" stroke="#FF0080" stroke-width="0.8" opacity="0.8" />
    <text x="42" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" fill="#F472B6" text-anchor="middle">HBM3e</text>
  </g>

  <!-- Typography: Platform Title -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#FFFFFF" class="pulsing-glow">
    SEMICONDUCTOR COPILOT
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="url(#cyanPurple)" opacity="0.85">
    SEMICONDUCTOR COPILOT
  </text>

  <!-- Version Pill -->
  <g transform="translate(600, 222)">
    <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#1E293B" stroke="#00F2FE" stroke-width="1.2" />
    <circle cx="-68" cy="0" r="4" fill="#00DF89" />
    <text x="-56" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#E2E8F0">
      VERSION 5.0 PROD
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="600" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
    Autonomous AI for Silicon Design, 2.5D/3D Chiplet &amp; Tape-out Sign-off
  </text>

  <!-- Bilingual Vietnamese/English Sub-bar -->
  <text x="600" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">
    🇻🇳 HỆ THỐNG TRỢ LÝ AI VI MẠCH BÁN DẪN &nbsp;•&nbsp; 🇺🇸 PRODUCTION EDA AI PLATFORM
  </text>

  <!-- Bottom Glowing Edge -->
  <path d="M 200 338 L 1000 338" stroke="url(#cyanPurple)" stroke-width="2.5" opacity="0.9" />
  <circle cx="600" cy="338" r="3" fill="#00F2FE" />
</svg>
