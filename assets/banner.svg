<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#4FACFE" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1050" y1="0" x2="1050" y2="320" />
  </g>

  <!-- Circuit Traces Left -->
  <g opacity="0.8">
    <path d="M 0 90 L 140 90 L 190 140 L 240 140" fill="none" stroke="#00F2FE" stroke-width="2.5" />
    <circle cx="240" cy="140" r="5" fill="#00F2FE" />
    <path d="M 0 230 L 160 230 L 210 180 L 270 180" fill="none" stroke="#7928CA" stroke-width="2" />
    <circle cx="270" cy="180" r="4.5" fill="#7928CA" />
  </g>

  <!-- Circuit Traces Right -->
  <g opacity="0.8">
    <path d="M 1200 90 L 1060 90 L 1010 140 L 960 140" fill="none" stroke="#00F2FE" stroke-width="2.5" />
    <circle cx="960" cy="140" r="5" fill="#00F2FE" />
    <path d="M 1200 230 L 1040 230 L 990 180 L 930 180" fill="none" stroke="#FF0080" stroke-width="2" />
    <circle cx="930" cy="180" r="4.5" fill="#FF0080" />
  </g>

  <!-- Central Silicon Chip Graphic -->
  <g transform="translate(600, 75)">
    <!-- Interposer Base -->
    <rect x="-85" y="-30" width="170" height="70" rx="8" fill="#0F172A" stroke="#00F2FE" stroke-width="2" />
    
    <!-- Die Substrate -->
    <rect x="-70" y="-22" width="140" height="54" rx="4" fill="url(#chipGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Microbump Pins -->
    <g fill="#F59E0B" opacity="0.95">
      <circle cx="-50" cy="24" r="2.5" />
      <circle cx="-35" cy="24" r="2.5" />
      <circle cx="-20" cy="24" r="2.5" />
      <circle cx="-5" cy="24" r="2.5" />
      <circle cx="10" cy="24" r="2.5" />
      <circle cx="25" cy="24" r="2.5" />
      <circle cx="40" cy="24" r="2.5" />
      <circle cx="55" cy="24" r="2.5" />
    </g>

    <!-- Silicon Die Internal Layout Blocks -->
    <rect x="-60" y="-14" width="48" height="30" rx="2" fill="#1E293B" stroke="#00F2FE" stroke-width="1" />
    <text x="-36" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#00F2FE" text-anchor="middle">CPU/NPU</text>

    <rect x="-6" y="-14" width="32" height="30" rx="2" fill="#1E293B" stroke="#7928CA" stroke-width="1" />
    <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#C084FC" text-anchor="middle">UCIe 2.0</text>

    <rect x="32" y="-14" width="28" height="30" rx="2" fill="#1E293B" stroke="#FF0080" stroke-width="1" />
    <text x="46" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#F472B6" text-anchor="middle">HBM3e</text>
  </g>

  <!-- Title -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#00F2FE">
    SEMICONDUCTOR COPILOT
  </text>

  <!-- Version Pill -->
  <g transform="translate(600, 222)">
    <rect x="-90" y="-13" width="180" height="26" rx="13" fill="#1E293B" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="-70" cy="0" r="4.5" fill="#00DF89" />
    <text x="-58" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#E2E8F0">
      VERSION 5.0 PROD
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="600" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
    Autonomous AI Platform for Silicon Design, 2.5D/3D Chiplet &amp; Tape-out Sign-off
  </text>

  <!-- Bilingual Tag -->
  <text x="600" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">
    🇻🇳 HỆ THỐNG TRỢ LÝ AI VI MẠCH BÁN DẪN &nbsp;•&nbsp; 🇺🇸 PRODUCTION EDA AI PLATFORM
  </text>

  <!-- Bottom Glowing Edge -->
  <path d="M 200 318 L 1000 318" stroke="url(#cyanPurple)" stroke-width="2.5" opacity="0.9" />
  <circle cx="600" cy="318" r="3.5" fill="#00F2FE" />
</svg>
