<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="darkUnder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Waving Path 1 -->
  <path d="M 0 40 C 300 0, 600 70, 900 30 C 1050 10, 1150 50, 1200 40 L 1200 120 L 0 120 Z" fill="url(#footerBg)" opacity="0.3" />

  <!-- Waving Path 2 -->
  <path d="M 0 60 C 250 80, 500 20, 750 50 C 950 75, 1100 35, 1200 55 L 1200 120 L 0 120 Z" fill="url(#footerBg)" opacity="0.6" />

  <!-- Base Underlay -->
  <rect y="90" width="1200" height="30" fill="url(#darkUnder)" />

  <!-- Silicon Dots Connection -->
  <circle cx="200" cy="50" r="3" fill="#00F2FE" />
  <circle cx="450" cy="40" r="2.5" fill="#FFFFFF" />
  <circle cx="750" cy="50" r="3" fill="#FF0080" />
  <circle cx="950" cy="45" r="2.5" fill="#00DF89" />
</svg>
